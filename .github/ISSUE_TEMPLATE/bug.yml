name: Bug report
description: Report incorrect behavior in HotDeploy
title: "fix: short description"
labels: ["kind:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15 / Windows 11 / Ubuntu 24.04"
    validations:
      required: true
